<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<link rel="icon" href="data:,">
<title>Instruments · Research Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://api.open-meteo.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<script>/* theme + mode bootstrap (runs before paint). Edit CONFIG further down, not this. */
(function(){var q=new URLSearchParams(location.search),d=document.documentElement;d.dataset.theme=q.get('theme')||'ink';if(q.get('card')==='0')d.classList.add('bare');})();</script>
<style>
:root{
  --surface:#232220; --line:rgba(236,230,218,.10); --hair:rgba(236,230,218,.09);
  --text:#ECE6DA; --muted:#A39D90; --accent:#D9A658; --accent-soft:rgba(217,166,88,.16);
  --serif:"Newsreader",Georgia,"Times New Roman",serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
:root[data-theme="paper"]{--surface:#F6F3EC;--line:rgba(38,35,31,.12);--hair:rgba(38,35,31,.12);--text:#26231F;--muted:#6B655B;--accent:#8F6418;--accent-soft:rgba(143,100,24,.14)}
@media (prefers-color-scheme: light){:root[data-theme="auto"]{--surface:#F6F3EC;--line:rgba(38,35,31,.12);--hair:rgba(38,35,31,.12);--text:#26231F;--muted:#6B655B;--accent:#8F6418;--accent-soft:rgba(143,100,24,.14)}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:transparent;overflow:hidden}
body{color:var(--text);font:400 12px/1.45 var(--mono);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
.card{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--hair);border-radius:14px;overflow:hidden}
.bare .card{background:transparent;border:0;border-radius:0}
.label{font:500 10.5px/1.25 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);white-space:nowrap}

.mast{flex:none;display:flex;align-items:center;justify-content:space-between;gap:28px;padding:clamp(14px,5.5vh,22px) clamp(18px,3vw,26px) clamp(12px,4.2vh,16px)}
.greet{min-width:0}
h1{margin:0 0 7px;font:400 clamp(22px,4vw,34px)/1.05 var(--serif);font-optical-sizing:auto;letter-spacing:-.012em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.quote{flex:1 1 0;max-width:52%;height:clamp(54px,22vh,84px);border:0;background:transparent;align-self:center}
.hint{display:none}
.rule{flex:none;position:relative;height:1px;background:var(--line);margin:0 clamp(18px,3vw,26px)}
.readings{flex:1;min-height:0;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr)}
.cell{position:relative;min-width:0}
.cell + .cell::before{content:"";position:absolute;left:0;top:16px;bottom:16px;width:1px;background:var(--line)}
.cell iframe{position:absolute;inset:0 4px;width:calc(100% - 8px);height:100%;border:0;background:transparent;display:block}
.cell:first-child iframe{left:clamp(4px,1.2vw,12px);width:calc(100% - clamp(4px,1.2vw,12px) - 4px)}
@media (max-width:760px){.quote{max-width:48%}}
@media (max-width:620px){
  .quote{display:none}
  .hint{display:block;position:absolute;right:0;top:-7px;line-height:14px;padding-left:10px;background:var(--surface)}
  .bare .hint{background:transparent}
  .readings{display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
  .readings::-webkit-scrollbar{display:none}
  .cell{flex:0 0 78%;scroll-snap-align:start}
  .cell:last-child{margin-right:12px}
}
@media (max-height:250px){h1{font-size:22px;margin-bottom:4px}.mast{padding-top:10px;padding-bottom:8px}}
</style>
</head>
<body>
<div class="card">
  <header class="mast">
    <div class="greet">
      <h1 id="greet">Good evening, Ahmed.</h1>
      <div class="label" id="dateline"></div>
    </div>
    <iframe class="quote" id="quote" title="Quote of the day"></iframe>
  </header>
  <div class="rule"><span class="label hint">swipe →</span></div>
  <section class="readings" id="readings"></section>
</div>
<script>
/* ============================== CONFIG ==============================
   The Home "instrument strip": a masthead + a row of compact widgets
   (each is its own file in this folder, loaded with ?card=0&compact=1).
   CELLS: order/choose any of clock, weather, countdown, progress, moon, timer, gpu.
   CELL_PARAMS: extra query string per cell, e.g. countdown: 'to=2027-01-28T23:59:00-12:00&label=ICML'.
   URL overrides: ?name=Ahmed&cells=clock,weather,moon&theme=paper  */
const NAME = 'Ahmed';
const DATE_TZ = 'Asia/Seoul';            // the date line is shown in this zone
const CELLS = ['clock', 'weather', 'countdown', 'progress', 'moon'];
const CELL_PARAMS = { countdown: '' };
const SHOW_QUOTE = true;
/* =================================================================== */

const q = new URLSearchParams(location.search);
const name = q.get('name') || NAME;
const cells = (q.get('cells') || CELLS.join(',')).split(',').map(s => s.trim()).filter(Boolean);
const theme = document.documentElement.dataset.theme;
const src = (w, extra) => `${w}.html?card=0&compact=1&theme=${encodeURIComponent(theme)}${extra ? '&' + extra : ''}`;

document.getElementById('readings').innerHTML = cells.map(c =>
  `<div class="cell"><iframe src="${src(c, CELL_PARAMS[c] || q.get(c) || '')}" title="${c}" scrolling="no"></iframe></div>`).join('');
const qf = document.getElementById('quote');
if (SHOW_QUOTE && q.get('quote') !== '0') qf.src = src('quote'); else qf.remove();

const WD = ['SUN','MON','TUE','WED','THU','FRI','SAT'], MO = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
function isoWeek(y, m, d) {
  const t = new Date(Date.UTC(y, m, d)), wd = t.getUTCDay() || 7;
  t.setUTCDate(t.getUTCDate() + 4 - wd);
  const y0 = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
  return Math.ceil(((t - y0) / 86400000 + 1) / 7);
}
function update() {
  const h = new Date().getHours();
  document.getElementById('greet').textContent =
    h >= 5 && h < 12 ? `Good morning, ${name}.` : h >= 12 && h < 18 ? `Good afternoon, ${name}.` : h >= 18 && h < 23 ? `Good evening, ${name}.` : `Still up, ${name}?`;
  const p = {}; new Intl.DateTimeFormat('en-CA', { timeZone: DATE_TZ, year: 'numeric', month: '2-digit', day: '2-digit' }).formatToParts(new Date()).forEach(x => p[x.type] = x.value);
  const y = +p.year, m = +p.month - 1, d = +p.day, t = Date.UTC(y, m, d);
  const doy = Math.round((t - Date.UTC(y, 0, 1)) / 86400000) + 1;
  document.getElementById('dateline').textContent = `${WD[new Date(t).getUTCDay()]} · ${d} ${MO[m]} ${y} · WEEK ${isoWeek(y, m, d)} · DAY ${doy}`;
}
update();
setInterval(update, 30000);
</script>
</body>
</html>
