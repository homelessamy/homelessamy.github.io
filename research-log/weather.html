<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<link rel="icon" href="data:,">
<title>Weather · Research Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://api.open-meteo.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<script>/* theme + mode bootstrap (runs before paint). Edit CONFIG further down, not this. */
(function(){var q=new URLSearchParams(location.search),d=document.documentElement;d.dataset.theme=q.get('theme')||'ink';if(q.get('card')==='0')d.classList.add('bare');if(q.get('compact')==='1')d.classList.add('compact');})();</script>
<style>
:root{
  --surface:#232220; --line:rgba(236,230,218,.10); --hair:rgba(236,230,218,.09);
  --text:#ECE6DA; --muted:#A39D90; --accent:#D9A658; --accent-soft:rgba(217,166,88,.16);
  --serif:"Newsreader",Georgia,"Times New Roman",serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
:root[data-theme="paper"]{--surface:#F6F3EC;--line:rgba(38,35,31,.12);--hair:rgba(38,35,31,.12);--text:#26231F;--muted:#6B655B;--accent:#8F6418;--accent-soft:rgba(143,100,24,.14)}
@media (prefers-color-scheme: light){:root[data-theme="auto"]{--surface:#F6F3EC;--line:rgba(38,35,31,.12);--hair:rgba(38,35,31,.12);--text:#26231F;--muted:#6B655B;--accent:#8F6418;--accent-soft:rgba(143,100,24,.14)}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:transparent;overflow:hidden}
body{color:var(--text);font:400 12px/1.45 var(--mono);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
.card{position:fixed;inset:0;background:var(--surface);border:1px solid var(--hair);border-radius:14px;overflow:hidden}
.bare .card{background:transparent;border:0;border-radius:0}
.label{font:500 10.5px/1.25 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.serif{font-family:var(--serif);font-variant-numeric:lining-nums tabular-nums;font-optical-sizing:auto}
.ico{display:block}
.ico *{fill:none;stroke:var(--text);stroke-width:1.35;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.ico .lum{stroke:var(--accent)}
.ico .mask{fill:var(--surface)}

/* ---- full ---- */
.wrap{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;gap:clamp(10px,4vh,22px);padding:clamp(16px,5vmin,30px) clamp(18px,6vmin,34px)}
.head{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.now{display:flex;align-items:center;gap:clamp(12px,4vw,26px)}
.now .ico{width:clamp(40px,min(15vw,22vh),72px);height:clamp(40px,min(15vw,22vh),72px);flex:none}
.temp{font-weight:300;font-size:clamp(40px,min(17vw,26vh),84px);line-height:.9;letter-spacing:-.02em}
.temp sup{font-size:.3em;vertical-align:1.45em;margin-left:.06em;color:var(--muted);font-weight:400}
.cond{font-family:var(--serif);font-size:clamp(15px,min(4.6vw,6vh),21px);line-height:1.2}
.feels{color:var(--muted);font-size:11.5px;margin-top:4px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px 18px;border-top:1px solid var(--line);padding-top:clamp(10px,3vh,16px)}
.grid div{min-width:0}
.grid .v{font-size:12px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
.foot{font-size:10.5px;color:var(--muted);letter-spacing:.02em}
@media (max-width:400px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.grid > div:nth-child(n+5){display:none}}
@media (max-height:279px){.foot{display:none}}
@media (min-width:401px) and (max-height:259px){.grid > div:nth-child(n+4){display:none}}
@media (max-width:400px) and (max-height:259px){.grid > div:nth-child(n+3){display:none}}
@media (max-height:200px){.grid{display:none}}

.err{color:var(--muted);font-family:var(--serif);font-style:italic;font-size:15px}

/* ---- compact (strip cell) grammar: label / figure / reading / caption / detail ----
   every cell shares these row heights, so readings line up across the strip */
.cmp{display:none}
.compact .wrap{display:none}
.compact .cmp{position:absolute;inset:0;display:flex;flex-direction:column;padding:14px 14px 13px}
.cmp .top{flex:none;display:flex;align-items:center;gap:8px;min-width:0;height:16px}
.cmp .top .label{min-width:0;overflow:hidden;text-overflow:ellipsis}
.cmp .top .tag{margin-left:auto}
.cmp .fig{flex:1 1 0;min-height:0;position:relative;margin:10px 0}
.cmp .fig > svg{position:absolute;left:0;top:50%;transform:translateY(-50%);overflow:visible}
.cmp .rd{flex:none;margin-top:auto;font-family:var(--serif);font-weight:300;font-variant-numeric:lining-nums tabular-nums;font-optical-sizing:auto;font-size:clamp(26px,min(22vw,14.5vh),40px);line-height:1;letter-spacing:-.015em;white-space:nowrap}
.cmp .rd .u{font-size:.42em;font-weight:400;color:var(--muted);margin-left:.1em;letter-spacing:0}
.cmp .rd .u.it{font-style:italic;margin-left:.28em}
.cmp .cap{flex:none;margin-top:7px;font-family:var(--serif);font-size:clamp(13px,min(9.5vw,6vh),15px);line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmp .cap.muted{color:var(--muted);font-style:italic}
.cmp .det{flex:none;margin-top:7px;font:400 10.5px/1.3 var(--mono);letter-spacing:.01em;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-height:175px){.cmp .fig{display:none}}
.cmp .rd .u.deg{vertical-align:.95em;margin-left:.05em}
.cmp .fig > svg.ico{width:auto;height:min(100%,46px);aspect-ratio:1}
</style>
</head>
<body>
<div class="card">
  <main class="wrap" id="full"></main>
  <section class="cmp" id="cmp"></section>
</div>
<script>
/* ============================== CONFIG ==============================
   Location for Open-Meteo (free, no API key). Coordinates in decimal degrees.
   URL overrides: ?lat=36.35&lon=127.38&name=Daejeon&tz=Asia/Seoul&units=imperial  */
const PLACE = {
  name:  'Daejeon',
  lat:   36.3504,
  lon:   127.3845,
  tz:    'Asia/Seoul',
  units: 'metric',        // 'metric' (°C, km/h) or 'imperial' (°F, mph)
};
const REFRESH_MINUTES = 15;
/* =================================================================== */

const q = new URLSearchParams(location.search);
const P = {
  name: q.get('name') || PLACE.name,
  lat: +(q.get('lat') || PLACE.lat),
  lon: +(q.get('lon') || PLACE.lon),
  tz: q.get('tz') || PLACE.tz,
  units: q.get('units') || PLACE.units,
};
const compact = document.documentElement.classList.contains('compact');
const imperial = P.units === 'imperial';
const KEY = `rl.weather.v1.${P.lat.toFixed(2)},${P.lon.toFixed(2)},${P.units}`;
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
};

function url() {
  const u = new URL('https://api.open-meteo.com/v1/forecast');
  u.search = new URLSearchParams({
    latitude: P.lat, longitude: P.lon,
    current: 'temperature_2m,apparent_temperature,relative_humidity_2m,precipitation,weather_code,wind_speed_10m,wind_direction_10m,is_day',
    daily: 'temperature_2m_max,temperature_2m_min,sunrise,sunset,precipitation_probability_max',
    timezone: P.tz, forecast_days: 1,
    ...(imperial ? { temperature_unit: 'fahrenheit', wind_speed_unit: 'mph', precipitation_unit: 'inch' } : {}),
  });
  return u.toString();
}

/* WMO weather interpretation codes (Open-Meteo docs) → [text, icon kind] */
const WMO = {
  0: ['Clear sky', 'clear'], 1: ['Mainly clear', 'few'], 2: ['Partly cloudy', 'partly'], 3: ['Overcast', 'cloud'],
  45: ['Fog', 'fog'], 48: ['Depositing rime fog', 'fog'],
  51: ['Light drizzle', 'drizzle'], 53: ['Moderate drizzle', 'drizzle'], 55: ['Dense drizzle', 'drizzle'],
  56: ['Light freezing drizzle', 'drizzle'], 57: ['Dense freezing drizzle', 'drizzle'],
  61: ['Slight rain', 'rain'], 63: ['Moderate rain', 'rain'], 65: ['Heavy rain', 'rain'],
  66: ['Light freezing rain', 'rain'], 67: ['Heavy freezing rain', 'rain'],
  71: ['Slight snowfall', 'snow'], 73: ['Moderate snowfall', 'snow'], 75: ['Heavy snowfall', 'snow'], 77: ['Snow grains', 'snow'],
  80: ['Slight rain showers', 'rain'], 81: ['Moderate rain showers', 'rain'], 82: ['Violent rain showers', 'rain'],
  85: ['Slight snow showers', 'snow'], 86: ['Heavy snow showers', 'snow'],
  95: ['Thunderstorm', 'storm'], 96: ['Thunderstorm, slight hail', 'storm'], 99: ['Thunderstorm, heavy hail', 'storm'],
};

/* Monoline icons on a 24-unit grid; geometry adapted from Feather Icons (MIT). Brass only for sun/moon. */
const SUN = (s = 1, x = 0, y = 0) => `<g class="lum" transform="translate(${x} ${y}) scale(${s})"><circle cx="12" cy="12" r="4.6"/>${[0,45,90,135,180,225,270,315].map(a => { const r = a * Math.PI / 180, c = Math.cos(r), n = Math.sin(r); return `<line x1="${(12 + 7.4 * c).toFixed(2)}" y1="${(12 + 7.4 * n).toFixed(2)}" x2="${(12 + 9.6 * c).toFixed(2)}" y2="${(12 + 9.6 * n).toFixed(2)}"/>`; }).join('')}</g>`;
const MOON = (s = 1, x = 0, y = 0) => `<g class="lum" transform="translate(${x} ${y}) scale(${s})"><path d="M20 13.2A8.2 8.2 0 1 1 10.8 4a6.4 6.4 0 0 0 9.2 9.2z"/></g>`;
const CLOUD = `<path class="mask" d="M17.5 19H8a5 5 0 1 1 1.1-9.88A6 6 0 0 1 20.4 11.2 3.9 3.9 0 0 1 17.5 19z"/>`;
const CLOUD_HI = `<path class="mask" d="M17.5 15.5H8a5 5 0 1 1 1.1-9.88A6 6 0 0 1 20.4 7.7a3.9 3.9 0 0 1-2.9 7.8z"/>`;
function icon(kind, day) {
  const lum = day ? SUN : MOON;
  let body;
  switch (kind) {
    case 'clear': body = day ? SUN(1) : MOON(1.05, -.6, -.6); break;
    case 'few': body = (day ? SUN(.62, 0, .2) : MOON(.62, 0, .4)) + `<g transform="translate(3.2 2.6) scale(.82)">${CLOUD}</g>`; break;
    case 'partly': body = (day ? SUN(.6, -.4, -.6) : MOON(.6, -.2, -.4)) + `<g transform="translate(1.4 1.6) scale(.92)">${CLOUD}</g>`; break;
    case 'cloud': body = CLOUD; break;
    case 'fog': body = `<line x1="4" y1="8" x2="20" y2="8"/><line x1="6" y1="12" x2="18" y2="12"/><line x1="4" y1="16" x2="16" y2="16"/><line x1="9" y1="20" x2="20" y2="20"/>`; break;
    case 'drizzle': body = CLOUD_HI + `<line x1="9" y1="18.5" x2="8.6" y2="19.6"/><line x1="13" y1="18.5" x2="12.6" y2="19.6"/><line x1="17" y1="18.5" x2="16.6" y2="19.6"/><line x1="11" y1="21.4" x2="10.6" y2="22.5"/><line x1="15" y1="21.4" x2="14.6" y2="22.5"/>`; break;
    case 'rain': body = CLOUD_HI + `<line x1="9" y1="18" x2="7.8" y2="21.6"/><line x1="13" y1="18" x2="11.8" y2="21.6"/><line x1="17" y1="18" x2="15.8" y2="21.6"/>`; break;
    case 'snow': body = CLOUD_HI + [[8.5,19],[12.5,19],[16.5,19],[10.5,22],[14.5,22]].map(([x, y]) => `<circle cx="${x}" cy="${y}" r=".55"/>`).join(''); break;
    case 'storm': body = CLOUD_HI + `<polyline points="12.8 15 10.4 19 13.6 19 11.2 23"/>`; break;
    default: body = CLOUD;
  }
  return `<svg class="ico" viewBox="0 0 24 24" aria-hidden="true">${body}</svg>`;
}

const COMPASS = ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'];
const dir = deg => COMPASS[Math.round(((deg % 360) + 360) % 360 / 22.5) % 16];
const r0 = v => Math.round(v);
const hhmm = iso => (iso || '').slice(11, 16);
const deg = imperial ? '°F' : '°';
const spd = imperial ? 'mph' : 'km/h';
const coord = `${Math.abs(P.lat).toFixed(2)}°${P.lat >= 0 ? 'N' : 'S'} ${Math.abs(P.lon).toFixed(2)}°${P.lon >= 0 ? 'E' : 'W'}`;
const full = document.getElementById('full'), cmp = document.getElementById('cmp');

// first variant whose laid-out width fits the line (Range width is fractional; scrollWidth rounds)
function fitText(el, variants) {
  const r = document.createRange();
  for (const v of variants) { el.innerHTML = v; r.selectNodeContents(el); if (r.getBoundingClientRect().width <= el.clientWidth - 0.5) return; }
}
let last = null;
function render(data, stale) {
  last = [data, stale];
  const c = data.current, d = data.daily;
  const [text, kind] = WMO[c.weather_code] || ['—', 'cloud'];
  const day = c.is_day === 1;
  const updated = new Date(data._fetched);
  const upd = new Intl.DateTimeFormat('en-GB', { timeZone: P.tz, hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }).format(updated);
  const hi = r0(d.temperature_2m_max[0]), lo = r0(d.temperature_2m_min[0]);
  const pp = d.precipitation_probability_max && d.precipitation_probability_max[0];
  if (compact) {
    cmp.innerHTML = `<div class="top"><span class="label" data-lab></span></div>
      <div class="fig">${icon(kind, day)}</div>
      <div class="rd">${r0(c.temperature_2m)}<span class="u deg">${deg}</span></div>
      <div class="cap">${text}</div>
      <div class="det" data-det></div>`;
    fitText(cmp.querySelector('[data-lab]'), [`Weather · ${P.name}`, P.name]);
    fitText(cmp.querySelector('[data-det]'), [`H ${hi}° L ${lo}° · ${r0(c.wind_speed_10m)} ${spd} ${dir(c.wind_direction_10m)}`, `H ${hi}° · L ${lo}° · ${r0(c.wind_speed_10m)} ${spd}`, `H ${hi}° · L ${lo}°`, `${hi}° / ${lo}°`]);
    return;
  }
  full.innerHTML = `
    <div class="head"><div class="label">${P.name} · ${coord}</div></div>
    <div class="now">
      ${icon(kind, day)}
      <div class="temp serif">${r0(c.temperature_2m)}<sup>${deg}</sup></div>
      <div><div class="cond">${text}</div><div class="feels">feels like ${r0(c.apparent_temperature)}${deg}</div></div>
    </div>
    <div class="grid">
      <div><div class="label">High · Low</div><div class="v">${hi}° · ${lo}°</div></div>
      <div><div class="label">Wind</div><div class="v">${r0(c.wind_speed_10m)} ${spd} ${dir(c.wind_direction_10m)}</div></div>
      <div><div class="label">Humidity</div><div class="v">${r0(c.relative_humidity_2m)}%</div></div>
      <div><div class="label">Precip</div><div class="v">${pp == null ? '—' : pp + '%'}${c.precipitation ? ' · ' + c.precipitation + (imperial ? ' in' : ' mm') : ''}</div></div>
      <div><div class="label">Sunrise</div><div class="v">${hhmm(d.sunrise[0])}</div></div>
      <div><div class="label">Sunset</div><div class="v">${hhmm(d.sunset[0])}</div></div>
    </div>
    <div class="foot">${stale ? 'offline · showing ' : 'updated '}${upd} · open-meteo.com</div>`;
}

function renderError() {
  const msg = `<span class="err">Weather unavailable right now.</span>`;
  if (compact) cmp.innerHTML = `<div class="top"><span class="label">Weather</span></div><div class="fig"></div><div class="cap muted">unavailable</div><div class="det">retrying in ${REFRESH_MINUTES} min</div>`;
  else full.innerHTML = `<div class="label">${P.name} · ${coord}</div>${msg}<div class="foot">open-meteo.com · retrying in ${REFRESH_MINUTES} min</div>`;
}

async function load() {
  try {
    const r = await fetch(url(), { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const data = await r.json();
    if (!data.current) throw new Error('no current block');
    data._fetched = Date.now();
    store.set(KEY, data);
    render(data, false);
  } catch (e) {
    const cached = store.get(KEY);
    if (cached && cached.current) render(cached, true); else renderError();
    console.warn('weather fetch failed:', e.message);
  }
}

if (document.fonts) document.fonts.ready.then(() => last && render(...last));
addEventListener('resize', () => last && render(...last));
const cached = store.get(KEY);
if (cached && cached.current) render(cached, false);
if (!cached || Date.now() - cached._fetched > 10 * 60000) load();
setInterval(load, REFRESH_MINUTES * 60000);
document.addEventListener('visibilitychange', () => {
  const c = store.get(KEY);
  if (!document.hidden && (!c || Date.now() - c._fetched > REFRESH_MINUTES * 60000)) load();
});
</script>
</body>
</html>
