<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<link rel="icon" href="data:,">
<title>Clock · Research Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<script>/* theme + mode bootstrap (runs before paint). Edit CONFIG further down, not this. */
(function(){var q=new URLSearchParams(location.search),d=document.documentElement;d.dataset.theme=q.get('theme')||'ink';if(q.get('card')==='0')d.classList.add('bare');if(q.get('compact')==='1')d.classList.add('compact');})();</script>
<style>
:root{
  --surface:#232220; --line:rgba(236,230,218,.10); --hair:rgba(236,230,218,.09);
  --text:#ECE6DA; --muted:#A39D90; --accent:#D9A658; --accent-soft:rgba(217,166,88,.16);
  --serif:"Newsreader",Georgia,"Times New Roman",serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
:root[data-theme="paper"]{--surface:#F6F3EC;--line:rgba(38,35,31,.12);--hair:rgba(38,35,31,.12);--text:#26231F;--muted:#6B655B;--accent:#8F6418;--accent-soft:rgba(143,100,24,.14)}
@media (prefers-color-scheme: light){:root[data-theme="auto"]{--surface:#F6F3EC;--line:rgba(38,35,31,.12);--hair:rgba(38,35,31,.12);--text:#26231F;--muted:#6B655B;--accent:#8F6418;--accent-soft:rgba(143,100,24,.14)}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:transparent;overflow:hidden}
body{color:var(--text);font:400 12px/1.45 var(--mono);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
.card{position:fixed;inset:0;background:var(--surface);border:1px solid var(--hair);border-radius:14px;overflow:hidden}
.bare .card{background:transparent;border:0;border-radius:0}
.label{font:500 10.5px/1.25 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.serif{font-family:var(--serif);font-variant-numeric:lining-nums tabular-nums;font-optical-sizing:auto}

/* ---- full layout ---- */
.wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:clamp(18px,6vw,56px);padding:clamp(14px,5vmin,32px)}
.face{flex:none;width:min(74vh,42vw);height:min(74vh,42vw)}
.zones{display:flex;flex-direction:column;gap:clamp(12px,4.5vh,26px);min-width:0;overflow:hidden}
.zones .label{overflow:hidden;text-overflow:ellipsis}
.zone .time{font-weight:300;font-size:clamp(30px,min(11vw,19vh),68px);line-height:1;letter-spacing:-.01em;margin:6px 0 6px}
.zone .sec{font-family:var(--mono);font-size:.26em;font-weight:400;color:var(--muted);margin-left:.35em;vertical-align:.95em;letter-spacing:0}
.zone.second .time{font-size:clamp(22px,min(6.6vw,11vh),40px);color:var(--text);opacity:.86}
.detail{font-size:11.5px;color:var(--muted);white-space:nowrap}
.off{color:var(--muted)}
@media (max-height:220px){
  .wrap{gap:clamp(14px,5vw,28px)}
  .zones{gap:8px}
  .zone .time{font-size:clamp(24px,min(9vw,20vh),48px);margin:3px 0 2px}
  .zone.second .time{font-size:clamp(18px,min(6vw,13vh),30px)}
  .zone .detail{display:none}
  .face{width:min(78vh,38vw);height:min(78vh,38vw)}
}
@media (max-aspect-ratio: 23/20){
  .wrap{flex-direction:column;gap:clamp(10px,4vh,24px)}
  .face{width:min(46vh,62vw);height:min(46vh,62vw)}
  .zones{flex-direction:row;gap:clamp(18px,8vw,40px);text-align:left}
  .zone .time{font-size:clamp(26px,min(11vw,10vh),48px)}
  .zone.second .time{font-size:clamp(20px,min(7.5vw,7vh),32px)}
}


/* clock face */
.rim{fill:none;stroke:var(--line);stroke-width:1}
.tk{stroke:var(--muted);stroke-linecap:round}
.tk.m{stroke-width:.7;opacity:.42}
.tk.h{stroke-width:1.5;stroke:var(--text);opacity:.72}
.tk.q{stroke-width:1.8;stroke:var(--text);opacity:.9}
.compact .tk.m{display:none}
.hand{stroke:var(--text);stroke-linecap:round}
.hand.hr{stroke-width:4}
.hand.mn{stroke-width:2.6}
.hand.sc{stroke:var(--accent);stroke-width:1.2}
.pin{fill:var(--accent)}
.pin-in{fill:var(--surface)}
.compact .hand.hr{stroke-width:6}
.compact .hand.mn{stroke-width:4}
.compact .hand.sc{stroke-width:2}

/* ---- compact (strip cell) grammar: label / figure / reading / caption / detail ----
   every cell shares these row heights, so readings line up across the strip */
.cmp{display:none}
.compact .wrap{display:none}
.compact .cmp{position:absolute;inset:0;display:flex;flex-direction:column;padding:14px 14px 13px}
.cmp .top{flex:none;display:flex;align-items:center;gap:8px;min-width:0;height:16px}
.cmp .top .label{min-width:0;overflow:hidden;text-overflow:ellipsis}
.cmp .top .tag{margin-left:auto}
.cmp .fig{flex:1 1 0;min-height:0;position:relative;margin:10px 0}
.cmp .fig > svg{position:absolute;left:0;top:50%;transform:translateY(-50%);overflow:visible}
.cmp .rd{flex:none;margin-top:auto;font-family:var(--serif);font-weight:300;font-variant-numeric:lining-nums tabular-nums;font-optical-sizing:auto;font-size:clamp(26px,min(22vw,14.5vh),40px);line-height:1;letter-spacing:-.015em;white-space:nowrap}
.cmp .rd .u{font-size:.42em;font-weight:400;color:var(--muted);margin-left:.1em;letter-spacing:0}
.cmp .rd .u.it{font-style:italic;margin-left:.28em}
.cmp .cap{flex:none;margin-top:7px;font-family:var(--serif);font-size:clamp(13px,min(9.5vw,6vh),15px);line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmp .cap.muted{color:var(--muted);font-style:italic}
.cmp .det{flex:none;margin-top:7px;font:400 10.5px/1.3 var(--mono);letter-spacing:.01em;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-height:175px){.cmp .fig{display:none}}
.cmp .fig > svg.face{width:auto;height:min(100%,96px);aspect-ratio:1}
.off{text-transform:none;letter-spacing:.04em}
</style>
</head>
<body>
<div class="card">
  <main class="wrap" id="full"></main>
  <section class="cmp" id="cmp"></section>
</div>
<script>
/* ============================== CONFIG ==============================
   Edit these constants, commit, and Notion picks up the change on reload.
   ZONES[0] drives the analog face. Use IANA time-zone names
   (https://en.wikipedia.org/wiki/List_of_tz_database_time_zones).
   URL overrides: ?tz1=Asia/Seoul&tz2=Asia/Karachi  ?h12=1  ?theme=paper  */
const ZONES = [
  { label: 'Daejeon',  tz: 'Asia/Seoul',   abbr: 'KST' },
  { label: 'Pakistan', tz: 'Asia/Karachi', abbr: 'PKT' },
];
const HOUR12 = false;          // true → 12-hour digital readout
const SMOOTH_SECONDS = true;   // sweeping second hand (ignored if the viewer prefers reduced motion)
/* =================================================================== */

const q = new URLSearchParams(location.search);
if (q.get('tz1')) ZONES[0] = { label: q.get('l1') || q.get('tz1').split('/').pop().replace(/_/g,' '), tz: q.get('tz1'), abbr: q.get('a1') || '' };
if (q.get('tz2')) ZONES[1] = { label: q.get('l2') || q.get('tz2').split('/').pop().replace(/_/g,' '), tz: q.get('tz2'), abbr: q.get('a2') || '' };
const h12 = q.has('h12') ? q.get('h12') === '1' : HOUR12;
const compact = document.documentElement.classList.contains('compact');
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const sweep = SMOOTH_SECONDS && !reduced;

/* --- time-zone helpers: offsets via Intl, so the viewer's own TZ never matters --- */
const fmts = {};
function parts(tz, d) {
  const f = fmts[tz] || (fmts[tz] = new Intl.DateTimeFormat('en-GB', { timeZone: tz, hourCycle: 'h23', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit' }));
  const o = {}; for (const p of f.formatToParts(d)) o[p.type] = p.value; return o;
}
function offsetMin(tz, d) {
  const p = parts(tz, d);
  const asUTC = Date.UTC(+p.year, +p.month - 1, +p.day, (+p.hour) % 24, +p.minute, +p.second);
  return Math.round((asUTC - Math.floor(d.getTime() / 1000) * 1000) / 60000);
}
let offsets = [], offsetsAt = 0;
function refreshOffsets(now) { offsets = ZONES.map(z => offsetMin(z.tz, new Date(now))); offsetsAt = now; }
function wall(i, now) { return new Date(now + offsets[i] * 60000); } // read with getUTC*

const pad = n => String(n).padStart(2, '0');
const WD = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MO = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function hm(w) {
  let h = w.getUTCHours(); const m = pad(w.getUTCMinutes());
  if (!h12) return pad(h) + ':' + m;
  const ap = h < 12 ? 'am' : 'pm'; h = h % 12 || 12;
  return h + ':' + m + '<span class="sec" style="vertical-align:0;margin-left:.25em">' + ap + '</span>';
}
function dateLong(w) { return WD[w.getUTCDay()] + ' ' + w.getUTCDate() + ' ' + MO[w.getUTCMonth()] + ' ' + w.getUTCFullYear(); }
function dateShort(w) { return WD[w.getUTCDay()] + ' ' + w.getUTCDate() + ' ' + MO[w.getUTCMonth()]; }
function offLabel(mins) {
  if (mins === 0) return 'same time';
  const s = mins < 0 ? '−' : '+', a = Math.abs(mins), h = Math.floor(a / 60), m = a % 60;
  return s + h + 'h' + (m ? pad(m) : '');
}
const zoneName = z => z.label + (z.abbr ? ' · ' + z.abbr : '');

/* --- face --- */
function faceSVG() {
  let t = '';
  for (let i = 0; i < 60; i++) {
    const cls = i % 15 === 0 ? 'q' : i % 5 === 0 ? 'h' : 'm';
    const r1 = 93, r0 = cls === 'q' ? 79 : cls === 'h' ? 83 : 88.5;
    const a = i * Math.PI / 30, s = Math.sin(a), c = -Math.cos(a);
    t += `<line class="tk ${cls}" x1="${(r0*s).toFixed(2)}" y1="${(r0*c).toFixed(2)}" x2="${(r1*s).toFixed(2)}" y2="${(r1*c).toFixed(2)}"/>`;
  }
  return `<svg class="face" viewBox="-100 -100 200 200" role="img" aria-label="Analog clock, ${zoneName(ZONES[0])}">
    <circle class="rim" r="98.5"/>${t}
    <line class="hand hr" x1="0" y1="9" x2="0" y2="-48"/>
    <line class="hand mn" x1="0" y1="11" x2="0" y2="-73"/>
    <line class="hand sc" x1="0" y1="19" x2="0" y2="-86"/>
    <circle class="pin" r="3.6"/><circle class="pin-in" r="1.3"/>
  </svg>`;
}

const full = document.getElementById('full'), cmp = document.getElementById('cmp');
if (!compact) {
  full.innerHTML = faceSVG() + `<div class="zones">${ZONES.map((z, i) => `
    <div class="zone ${i ? 'second' : 'primary'}">
      <div class="label">${zoneName(z)}${i ? ' <span class="off" data-off></span>' : ''}</div>
      <div class="time serif" data-time></div>
      <div class="detail" data-date></div>
    </div>`).join('')}</div>`;
} else {
  cmp.innerHTML = `<div class="top"><span class="label">${zoneName(ZONES[0])}</span></div>
    <div class="fig">${faceSVG()}</div>
    <div class="rd" data-time></div>
    <div class="cap" data-date></div>
    ${ZONES[1] ? `<div class="det" data-second></div>` : ''}`;
}
const root = compact ? cmp : full;
const hands = { hr: root.querySelector('.hr'), mn: root.querySelector('.mn'), sc: root.querySelector('.sc') };
const timeEls = root.querySelectorAll('[data-time]'), dateEls = root.querySelectorAll('[data-date]'), offEl = root.querySelector('[data-off]'), secondEl = root.querySelector('[data-second]');

let lastSec = -1;
function frame() {
  const now = Date.now();
  if (now - offsetsAt > 60000 || !offsets.length) refreshOffsets(now);
  const w = wall(0, now);
  const ms = w.getUTCMilliseconds(), s = w.getUTCSeconds() + (sweep ? ms / 1000 : 0);
  const m = w.getUTCMinutes() + s / 60, h = (w.getUTCHours() % 12) + m / 60;
  hands.sc.setAttribute('transform', `rotate(${(s * 6).toFixed(2)})`);
  hands.mn.setAttribute('transform', `rotate(${(m * 6).toFixed(2)})`);
  hands.hr.setAttribute('transform', `rotate(${(h * 30).toFixed(2)})`);
  const sec = Math.floor(now / 1000);
  if (sec !== lastSec) {
    lastSec = sec;
    if (!compact) {
      ZONES.forEach((z, i) => {
        const wi = wall(i, now);
        timeEls[i].innerHTML = hm(wi) + (i === 0 && !h12 ? `<span class="sec">${pad(wi.getUTCSeconds())}</span>` : '');
        dateEls[i].textContent = i === 0 ? dateLong(wi) : dateShort(wi);
      });
      if (offEl) offEl.textContent = '· ' + offLabel(offsets[1] - offsets[0]);
    } else {
      timeEls[0].innerHTML = hm(w);
      dateEls[0].textContent = dateShort(w);
      if (secondEl) { const w2 = wall(1, now); secondEl.innerHTML = `${ZONES[1].abbr || ZONES[1].label} ${hm(w2).replace(/<[^>]+>/g,' ')} · ${offLabel(offsets[1] - offsets[0])}`; }
    }
  }
  if (sweep) requestAnimationFrame(frame);
}
frame();
if (!sweep) setInterval(frame, 250);
document.addEventListener('visibilitychange', () => { if (!document.hidden) offsetsAt = 0; });
</script>
</body>
</html>
